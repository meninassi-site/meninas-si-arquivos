<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Administrativo - Meninas de Sistemas</title>

    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-wrapper {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding: 20px;
        }

        /* LADO ESQUERDO: LOGO, TÍTULOS E BOTÃO */
        .hero-left-content {
            flex: 1;
            max-width: 450px;
        }

        .hero-logo {
            height: 55px;
            margin-bottom: 50px;
            display: block;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #4a154b; /* Roxo escuro do título */
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: #333333;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .btn-entrar-hero {
            display: inline-block;
            width: 220px;
            padding: 14px;
            background-color: #5b21b6; /* Roxo vibrante */
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(91, 33, 182, 0.2);
        }

        .btn-entrar-hero:hover {
            background-color: #4c1d95;
        }

        .btn-entrar-hero:active {
            transform: scale(0.98);
        }

        /* LADO DIREITO: IMAGEM */
        .hero-right-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 850px) {
            .hero-wrapper {
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .hero-left-content {
                max-width: 100%;
            }

            .hero-logo {
                margin: 0 auto 30px auto;
            }

            .hero-right-content {
                margin-top: 20px;
            }

            .btn-entrar-hero {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="hero-wrapper">

    <!-- COLUNA DA ESQUERDA: LOGO + TEXTOS + BOTÃO -->
    <div class="hero-left-content">
        
        <!-- Logo no canto superior esquerdo -->
        <a href="index.html">
            <img src="../assets/images/icons/LogoMeninasDeSistema.png" alt="Logo Meninas de Sistemas" class="hero-logo">
        </a>

        <!-- Título principal -->
        <h1 class="hero-title">Site Administrativo</h1>

        <!-- Subtítulo -->
        <p class="hero-subtitle">Organizador do site meninas de Sistemas</p>

        <!-- Botão Entrar que vai para a tela de Login -->
        <a href="login.html" class="btn-entrar-hero">Entrar</a>

    </div>

    <!-- COLUNA DA DIREITA: IMAGEM DA MOÇA COM O RETÂNGULO ROXO -->
    <div class="hero-right-content">
        <!-- Substitua pelo caminho correto da sua imagem -->
        <img src="../assets/images/icons/meninanegra.png" alt="Mulher sorrindo e apontando" class="hero-image">
    </div>

</div>

</body>
</html>
