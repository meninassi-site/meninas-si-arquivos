<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Postagem - Meninas de Sistemas</title>

    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="admin-body">

<!-- HEADER SIMPLIFICADO -->
<header class="admin-header">
    <div class="admin-header-container">
        <div class="logo-container">
            <a href="adm_noticias.html">
                <img src="../assets/images/LogoMeninasDeSistema.png" alt="Logo Meninas de Sistemas" class="logo-topo">
            </a>
        </div>

        <div class="admin-user-profile">
            <span>Usuário</span>
            <svg class="user-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
        </div>
    </div>
</header>

<!-- DASHBOARD (SIDEBAR + EDITOR) -->
<div class="admin-dashboard-container">

    <!-- MENU LATERAL FLUTUANTE -->
    <aside class="admin-sidebar">
        <nav class="sidebar-menu">
            <a href="adm_noticias.html" class="sidebar-item active">Postagens</a>
            <a href="membros.html" class="sidebar-item">Membros</a>
        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL (EDITOR) -->
    <main class="admin-main-content">
        
        <form class="editor-layout">
            
            <!-- COLUNA DA ESQUERDA: CAMPOS DO FORMULÁRIO -->
            <div class="editor-fields-column">
                
                <h2 class="editor-title">Editor de Postagem</h2>

                <!-- Campo Título -->
                <div class="editor-group">
                    <input type="text" id="titulo" name="titulo" class="editor-input" placeholder="Titulo" required>
                </div>

                <!-- Tipo de Postagem (Radio Buttons) -->
                <div class="editor-group post-type-group">
                    <span class="post-type-label">Tipo de Postagem</span>
                    <label class="radio-option">
                        <input type="radio" name="tipo" value="noticia" checked>
                        <span class="custom-radio"></span>
                        Noticia
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="tipo" value="evento">
                        <span class="custom-radio"></span>
                        Evento
                    </label>
                </div>

                <!-- Corpo do Texto (Textarea) -->
                <div class="editor-group">
                    <textarea id="conteudo" name="conteudo" class="editor-textarea" placeholder="Máximo X caracteres"></textarea>
                </div>

                <!-- BOTOES DE AÇÃO -->
                <div class="editor-buttons">
                    <button type="submit" class="btn-editor btn-salvar">Salvar</button>
                    <button type="button" class="btn-editor btn-excluir">Excluir</button>
                </div>

            </div>

            <!-- COLUNA DA DIREITA: UPLOAD DE IMAGEM -->
            <div class="editor-image-column">
                <h2 class="editor-title image-title">Imagem</h2>
                
                <div class="image-upload-box" onclick="document.getElementById('image-input').click();">
                    <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="previewImage(event)">
                    
                    <div id="upload-placeholder" class="upload-placeholder">
                        <svg class="placeholder-icon" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                    <img id="image-preview" src="#" alt="Pré-visualização" style="display: none;" class="preview-img">
                </div>
            </div>

        </form>

    </main>

</div>

<script>
    // Função para pré-visualizar a imagem selecionada
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            output.src = reader.result;
            output.style.display = 'block';
            placeholder.style.display = 'none';
        };
        if(event.target.files[0]){
            reader.readAsDataURL(event.target.files[0]);
        }
    }
</script>

</body>
</html>
